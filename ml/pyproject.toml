[project]
name = "scout-ml"
version = "0.1.0"
description = "Expected-threat model (PyTorch) and build-up pattern clustering"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "polars>=1.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy", "matplotlib>=3.9", "jupyter", "nbconvert", "scipy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]
