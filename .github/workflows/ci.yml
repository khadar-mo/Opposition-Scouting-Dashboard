name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Lint (ruff)
        run: uv run ruff check pipeline backend ml
      - name: Type-check (mypy strict)
        run: uv run mypy pipeline/src backend/src ml/src
      - name: Tests (pytest)
        # DB-backed API tests self-skip when no populated database is present.
        run: uv run pytest pipeline/tests backend/tests ml/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type-check + build (tsc strict, vite)
        run: npm run build
      - name: Tests (vitest)
        run: npm test
